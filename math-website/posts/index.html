<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Posts · Math Notes</title>
  <meta name="description" content="A clean math website with MathJax."/>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/assets/style.css"/>
  
<!-- MathJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$','$$'], ['\\[', '\\]']],
    tags: 'ams'
  },
  svg: { fontCache: 'global' }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.min.js"></script>

</head>
<body>
<div class="container">
  <nav class="nav">
    <div class="brand">
      <img src="/assets/favicon.svg" alt="" width="28" height="28"/>
      <span>Math Notes</span>
    </div>
    <div style="display:flex; gap:14px">
      <a href="/" class="note">Home</a>
      <a href="/posts/" class="note">Posts</a>
      <a href="https://github.com/" class="note">GitHub</a>
    </div>
  </nav>

  <h1>Posts</h1>
  <p class="note">Add your posts in this folder and link them here.</p>
  <div class="grid">
    <article class="card">
      <h3><a href="/posts/sample-article.html">Sample Article: A Tiny Theorem</a></h3>
      <p>Short demo using theorem-proof style and MathJax.</p>
    </article>
    <article class="card">
      <h3><a href="/posts/post-template.html">Post Template</a></h3>
      <p>Copy this page to start a new post.</p>
    </article>
  </div>

  <footer>
    Built with plain HTML + MathJax. © <span id="year"></span>
  </footer>
</div>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
